// Sally's Escape for Android phones, tablets and Android TV (NVIDIA Shield). The game itself is the
// web game in public/, copied into assets/www by the release workflow; see android/README.md.
plugins { id 'com.android.application' }

def env = System.getenv()

android {
    namespace 'com.masonrobert.savesally'
    compileSdk 34
    defaultConfig {
        applicationId 'com.masonrobert.savesally'
        minSdk 24
        targetSdk 34
        versionCode((env.VERSION_CODE ?: '1') as int)
        versionName env.VERSION_NAME ?: 'dev'
    }
    signingConfigs {
        release {
            if (env.KEYSTORE_FILE) {
                storeFile file(env.KEYSTORE_FILE)
                storePassword env.KEYSTORE_PASSWORD
                keyAlias env.KEY_ALIAS
                keyPassword env.KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (env.KEYSTORE_FILE) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
