name: Test and publish standalone game

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sally-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run prepare:static
      - name: Check and photograph isometric example
        run: |
          node --test tests/isometric.cjs
          node scripts/smoke-isometric-browser.cjs
        env:
          SEASON_SCREENSHOTS: '1'
      - name: Render seasonal game in a real browser
        run: node scripts/smoke-seasons-browser.cjs
        env:
          SEASON_SCREENSHOTS: '1'
      - run: npm test
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: sally-ci:test
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the actual standalone image
        run: |
          docker run -d --name sally-smoke --read-only --cap-drop ALL --security-opt no-new-privileges:true --tmpfs /tmp -p 127.0.0.1:18080:8080 sally-ci:test
          node scripts/smoke.cjs http://127.0.0.1:18080 ${{ github.sha }}
          docker restart sally-smoke
          node scripts/smoke.cjs http://127.0.0.1:18080 ${{ github.sha }}
      - name: Container diagnostics
        if: failure()
        run: docker logs sally-smoke || true
      - name: Remove disposable test container
        if: always()
        run: docker rm -f sally-smoke || true

  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/masadams/sallysescape
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Publish both server architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
