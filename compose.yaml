services:
  sallys-escape:
    image: ghcr.io/masadams/sallysescape:${IMAGE_TAG:-latest}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    environment:
      # The address players use, so admin passkeys are bound to it. The first start prints a
      # one-time admin setup code in the log (see docs/BUILDER.md).
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      # One reverse proxy (nginx) sits in front of the game; only the address it adds is trusted.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - sally-data:/data
    # Resource and log limits keep a misbehaving request from starving the rest of the host.
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100
    logging:
      driver: json-file
      options: {max-size: "5m", max-file: "3"}
    networks: [proxy]
    expose: ["8080"]
volumes:
  sally-data:
networks:
  proxy:
    external: true
    name: ${NPM_NETWORK:-nginx_default}
